version: '3.8'

services:
  notification-service:
    image: notification-service:latest
    container_name: notification-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"

      LOGGING_LEVEL_ORG_NOTIFICATION: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: INFO

      SERVER_PORT: 8082

      WSO2_TOKEN_URL: ${WSO2_TOKEN_URL}
      WSO2_CLIENT_ID: ${WSO2_CLIENT_ID}
      WSO2_CLIENT_SECRET: ${WSO2_CLIENT_SECRET}
      WSO2_MIR_BASE_URL: ${WSO2_MIR_BASE_URL}
      WSO2_MIR_NOTIFICATION_PATH: ${WSO2_MIR_NOTIFICATION_PATH}

    restart: always
